[workspace]
resolver = "2"
members = [
  "crates/pqauth-core",
  "crates/pqauth-client",
  "programs/pqauth",
  "tools/pqauth-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/permissionlesslabs/pqauth-solana"

[workspace.dependencies]
pqauth-core = { path = "crates/pqauth-core" }
solana-program = "=5.1.0"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10.9", default-features = false }
clap = { version = "4.5.48", features = ["derive"] }
hex = "0.4.3"
bs58 = "0.5.1"
getrandom = "0.3.3"
zeroize = "1.8.2"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
